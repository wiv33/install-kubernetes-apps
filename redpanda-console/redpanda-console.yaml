config:
  kafka:
    brokers:
      - b-1.test.test.c4.kafka.ap-northeast-2.amazonaws.com:9098
      - b-2.test.test.c4.kafka.ap-northeast-2.amazonaws.com:9098
    tls:
      enabled: true
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-512
      username: ACCESS_KEY
      password: SECRET_KEY

  schemaRegistry:
    enabled: true
    urls:
      - http://schema-registry-svc.kafka.svc.cluster.local:8081

service:
  type: ClusterIP

ingress:
  enabled: false

