---
# FE 스케일링 설정
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fe-scaler
  namespace: starrocks
spec:
  scaleTargetRef:
    name: kube-starrocks-fe
    kind: StatefulSet
  minReplicaCount: 3
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 900  # 15분
          policies:
          - type: Pods
            value: 1
            periodSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
          - type: Pods
            value: 1
            periodSeconds: 120
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "60"
  - type: prometheus
    metadata:
      serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
      metricName: fe_metadata_operations
      query: |
        rate(starrocks_fe_metadata_operation_total[5m])
      threshold: "1000"