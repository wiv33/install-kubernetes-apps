image:
  repository: 677062093523.dkr.ecr.ap-northeast-2.amazonaws.com/vircle/schema-registry-iam
  tag: latest
  pullPolicy: Always

replicaCount: 1

configuration: |-
  listeners=http://0.0.0.0:8081
  kafkastore.bootstrap.servers=b-2.vircledev.bvpopq.c4.kafka.ap-northeast-2.amazonaws.com:9098,b-1.vircledev.bvpopq.c4.kafka.ap-northeast-2.amazonaws.com:9098
  kafkastore.security.protocol=SASL_SSL
  kafkastore.sasl.mechanism=AWS_MSK_IAM
  kafkastore.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
  kafkastore.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
  schema.registry.avro.compatibility.level=backward
  schema.registry.host.name=schema-registry

command:
  - /etc/confluent/docker/run
service:
  type: ClusterIP

serviceAccount:
  name: schema-registry-sa
  create: false
