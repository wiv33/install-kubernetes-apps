release:
  version: "4.1.0"

openebs-crds:
  csi:
    volumeSnapshots:
      enabled: true
      keep: true
  global:
    tolerations:
      - key: type
        operator: Equal
        value: web
        effect: NoSchedule
      - key: type
        operator: Equal
        value: backbone
        effect: NoSchedule
# Refer to https://github.com/openebs/dynamic-localpv-provisioner/blob/HEAD/deploy/helm/charts/values.yaml for complete set of values.
localpv-provisioner:
  rbac:
    create: true
  localpv:
    tolerations:
      - key: type
        operator: Equal
        value: web
        effect: NoSchedule
      - key: type
        operator: Equal
        value: backbone
        effect: NoSchedule
# Refer to https://github.com/openebs/zfs-localpv/blob/HEAD/deploy/helm/charts/values.yaml for complete set of values.
zfs-localpv:
  enabled: true
  crds:
    zfsLocalPv:
      enabled: true
    csi:
      volumeSnapshots:
        enabled: false
  zfsController:
    tolerations:
      - key: type
        operator: Equal
        value: web
        effect: NoSchedule
      - key: type
        operator: Equal
        value: backbone
        effect: NoSchedule
# Refer to https://github.com/openebs/lvm-localpv/blob/HEAD/deploy/helm/charts/values.yaml for complete set of values.
lvm-localpv:
  enabled: true
  crds:
    lvmLocalPv:
      enabled: true
    csi:
      volumeSnapshots:
        enabled: false
  lvmNode:
    tolerations:
      - key: type
        operator: Equal
        value: web
        effect: NoSchedule
      - key: type
        operator: Equal
        value: backbone
        effect: NoSchedule
  lvmController:
    tolerations:
      - key: type
        operator: Equal
        value: web
        effect: NoSchedule
      - key: type
        operator: Equal
        value: backbone
        effect: NoSchedule
# Refer to https://github.com/openebs/mayastor-extensions/blob/v2.7.0/chart/values.yaml for complete set of values.
mayastor:
  enabled: true
  csi:
    node:
      initContainers:
        enabled: true
  etcd:
    # -- Kubernetes Cluster Domain
    clusterDomain: cluster.local
  localpv-provisioner:
    enabled: false
  crds:
    enabled: false
  tolerations:
    - key: type
      operator: Equal
      value: web
      effect: NoSchedule
    - key: type
      operator: Equal
      value: backbone
      effect: NoSchedule
# -- Configuration options for pre-upgrade helm hook job.
preUpgradeHook:
  image:
    # -- The container image registry URL for the hook job
    registry: docker.io
    # -- The container repository for the hook job
    repo: bitnami/kubectl
    # -- The container image tag for the hook job
    tag: "1.25.15"
    # -- The imagePullPolicy for the container
    pullPolicy: IfNotPresent

engines:
  local:
    lvm:
      enabled: true
    zfs:
      enabled: true
  replicated:
    mayastor:
      enabled: true
